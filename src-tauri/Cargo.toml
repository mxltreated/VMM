[package]
name = "vintage-story-mod-manager"
version = "1.1.0"
description = "Minimalist Vintage Mod Manager (VMM)"
authors = ["User"]
edition = "2021"

[lib]
name = "vintage_story_mod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
zip = "2"
semver = "1"
base64 = "0.22"
dirs = "6"
futures-util = "0.3"
urlencoding = "2"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
