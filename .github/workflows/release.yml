name: Release VMM

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Vintage Mod Manager v__VERSION__'
          releaseBody: 'See the assets below to download and install this release.'
          releaseDraft: false
          prerelease: false

      - name: Upload standalone zip for in-app updates
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = "src-tauri/target/release/vintage-story-mod-manager.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected release binary not found at $exe"
          }
          $stage = Join-Path $env:RUNNER_TEMP "vmm-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe (Join-Path $stage "Vintage Mod Manager.exe") -Force
          $zipPath = Join-Path $env:RUNNER_TEMP "VMM-windows-x64.zip"
          Compress-Archive -Path (Join-Path $stage "Vintage Mod Manager.exe") -DestinationPath $zipPath -Force
          gh release upload "${{ github.ref_name }}" $zipPath --clobber
